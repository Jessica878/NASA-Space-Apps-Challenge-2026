services:
  - type: web
    name: lunaris-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -c "import urllib.request; urllib.request.urlretrieve('https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_60S_240MPP_ADJ.TIF', 'backend/LDEM_60S_240MPP_ADJ.tiff')"
    startCommand: python -m uvicorn backend.terrain_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /